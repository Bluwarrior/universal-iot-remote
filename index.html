<!DOCTYPE html>
<html>
<head>
    <title>GitHub - Authentication Required</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #f6f8fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .captcha-box { background: white; border: 1px solid #d0d7de; border-radius: 6px; padding: 24px; box-shadow: 0 8px 24px rgba(149,157,165,0.2); text-align: center; width: 300px; }
        .checkbox-container { display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; padding: 15px; background: #fafafa; cursor: pointer; border-radius: 3px; }
        .checkbox { width: 24px; height: 24px; border: 2px solid #c1c1c1; margin-right: 10px; background: white; }
        .text { font-size: 14px; color: #555; font-weight: 500; }
        h2 { font-size: 16px; margin-bottom: 20px; color: #24292f; }
        #scare-text { display: none; font-size: 50px; font-weight: bold; color: red; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
    </style>
</head>
<body>

<div class="captcha-box" id="main-box">
    <h2>Verify your session</h2>
    <div class="checkbox-container" onclick="startPrank()">
        <div class="checkbox" id="check"></div>
        <div class="text">I'm not a robot</div>
    </div>
    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" style="width:30px; margin-top:15px;">
</div>

<div id="scare-text">
    <h1 style="color: white;">APRIL FOOLS!</h1>
</div>

<audio id="alarm" src="https://www.myinstants.com/media/sounds/earrape-meme-v2.mp3" loop></audio>

<script>
    function startPrank() {
        const audio = document.getElementById('alarm');
        const box = document.getElementById('main-box');
        const scare = document.getElementById('scare-text');
        
        // Check the box visually
        document.getElementById('check').style.backgroundColor = '#4CAF50';
        document.getElementById('check').innerHTML = '✔';
        document.getElementById('check').style.color = 'white';

        // Blast Audio (Interaction unlocks this on iPhone)
        audio.volume = 1.0;
        audio.play();

        // Visual Scare
        setTimeout(() => {
            box.style.display = 'none';
            scare.style.display = 'flex';
        }, 300);
    }
</script>

</body>
</html>
